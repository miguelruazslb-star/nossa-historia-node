<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- pré-visualização bonita quando partilhas o link (WhatsApp, iMessage, etc.) -->
<meta property="og:title" content="A Nossa História ❤️">
<meta property="og:description" content="Uma pequena viagem pela nossa história — feita com amor.">
<meta property="og:image" content="fotos/capa.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<!-- compatibilidade com Safari/iPhone -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nós ❤">
<meta name="theme-color" content="#C97B85">
<link rel="apple-touch-icon" href="fotos/capa.jpg">
<title>A Nossa História</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF5EF;
  --paper:#FFFFFF;
  --rose-pale:#F6DEE3;
  --rose:#E7A9B4;
  --rose-deep:#C97B85;
  --ink:#4A3A3C;
  --ink-soft:#8A7477;
  --gold:#C7A876;
  --shadow: 0 10px 30px -12px rgba(151, 94, 104, .28);
  --radius: 22px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;}
html{scroll-behavior:smooth; height:-webkit-fill-available;}
body{
  -webkit-overflow-scrolling:touch;
  margin:0;
  min-height:100vh;
  min-height:-webkit-fill-available;
  background:var(--cream);
  color:var(--ink);
  font-family:'Poppins',sans-serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.serif{
  font-family:'Playfair Display', serif;
  font-weight:600;
  margin:0;
}
p{line-height:1.7;}
::selection{background:var(--rose); color:#fff;}

#petals{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
.petal{
  position:absolute; top:-5%;
  font-size:16px; opacity:.5;
  animation:fall linear infinite;
  filter:hue-rotate(0deg);
}
@keyframes fall{
  to{ transform:translateY(110vh) rotate(360deg); }
}

.app{ position:relative; z-index:1; min-height:100vh; display:flex; }

nav.dock{
  width:96px;
  flex-shrink:0;
  background:var(--paper);
  border-right:1px solid #F1E3E6;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 0;
  padding-top:calc(28px + env(safe-area-inset-top));
  gap:4px;
  position:sticky; top:0; height:100vh; height:-webkit-fill-available; overflow-y:auto; -webkit-overflow-scrolling:touch;
  z-index:50;
}
nav.dock::-webkit-scrollbar{width:0;}
.brand{
  font-family:'Playfair Display',serif;
  font-size:22px; color:var(--rose-deep); margin-bottom:18px;
}
.navbtn{ touch-action:manipulation;
  width:72px; padding:10px 4px 12px;
  border:none; background:transparent; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  border-radius:16px; color:var(--ink-soft);
  transition:all .25s ease;
  font-family:'Poppins',sans-serif;
}
.navbtn .ic{font-size:19px;}
.navbtn .lb{font-size:9.5px; letter-spacing:.02em; text-align:center; line-height:1.2;}
.navbtn:hover{background:var(--rose-pale); color:var(--rose-deep); transform:translateY(-2px);}
.navbtn.active{background:var(--rose); color:#fff; box-shadow:var(--shadow);}
.navbtn.locked-next{ opacity:.85; }
.navbtn.locked-next .ic{ filter:grayscale(.3); }

main{flex:1; min-width:0;}
.page{ display:none; animation:fadeIn .5s ease; padding:56px 8vw 90px; max-width:1180px; margin:0 auto; }
.page.active{display:block;}
@keyframes fadeIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

.eyebrow{
  display:inline-block; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--rose-deep); font-weight:600; margin-bottom:10px;
}
.title{font-size:clamp(28px,4vw,44px); color:var(--ink); margin-bottom:10px;}
.subtitle{color:var(--ink-soft); font-size:15.5px; max-width:560px; margin-bottom:36px;}

.btn{ touch-action:manipulation;
  display:inline-flex; align-items:center; gap:8px;
  background:var(--rose-deep); color:#fff; border:none;
  padding:14px 28px; border-radius:100px; font-size:14.5px; font-weight:500;
  font-family:'Poppins',sans-serif; cursor:pointer; box-shadow:var(--shadow);
  transition:transform .25s ease, box-shadow .25s ease;
}
.btn:hover{transform:translateY(-3px) scale(1.02);}
.btn.ghost{ background:transparent; color:var(--rose-deep); border:1.5px solid var(--rose); box-shadow:none;}
.btn.ghost:hover{background:var(--rose-pale);}

.hero{
  min-height:calc(100vh - 60px);
  min-height:calc(-webkit-fill-available - 60px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:22px; padding:40px 6vw;
}
.hero-greeting{
  font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:600;
}
.hero-photo{
  width:230px; height:230px; border-radius:50%;
  background:linear-gradient(145deg,var(--rose-pale),var(--rose));
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif; font-size:20px; color:#fff;
  box-shadow:0 20px 45px -15px rgba(201,123,133,.55);
  border:6px solid #fff;
  position:relative; overflow:hidden;
}
.hero-photo img{ width:100%; height:100%; object-fit:cover; }
.hero-photo.ph-fallback::before{
  content:'Foto de vocês'; text-align:center; line-height:1.3; padding:0 20px;
}
.hero-photo::after{
  content:'📷 fotos/capa.jpg';
  position:absolute; bottom:-30px; font-size:10.5px; color:var(--ink-soft); font-family:'Poppins'; white-space:nowrap;
}
.hero-names{ font-size:clamp(34px,6vw,58px); color:var(--ink); }
.hero-names .amp{ color:var(--rose-deep); padding:0 6px;}
.hero-phrase{ font-style:italic; color:var(--ink-soft); font-size:17px; max-width:480px; font-family:'Playfair Display',serif; }
.hero-daily{
  margin-top:6px; background:var(--paper); border:1px solid var(--rose-pale);
  padding:12px 22px; border-radius:100px; font-size:13.5px; color:var(--rose-deep);
  box-shadow:var(--shadow);
}

.timeline{ position:relative; margin-top:10px; }
.timeline::before{
  content:''; position:absolute; left:29px; top:6px; bottom:6px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--rose) 0 8px, transparent 8px 16px);
}
.tl-item{ position:relative; padding-left:76px; margin-bottom:38px; }
.tl-dot{
  position:absolute; left:14px; top:0; width:32px; height:32px; border-radius:50%;
  background:var(--rose); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:15px; box-shadow:var(--shadow); border:3px solid var(--cream);
}
.tl-card{
  background:var(--paper); border-radius:var(--radius); padding:22px 26px;
  box-shadow:var(--shadow); transition:transform .3s ease;
}
.tl-card:hover{ transform:translateY(-4px); }
.tl-date{ font-size:12px; color:var(--gold); font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.tl-title{ font-family:'Playfair Display',serif; font-size:19px; margin:6px 0 8px; }
.tl-text{ color:var(--ink-soft); font-size:14px; }

.tabs{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
.tab{
  border:1.5px solid var(--rose-pale); background:var(--paper); color:var(--ink-soft);
  padding:9px 18px; border-radius:100px; cursor:pointer; font-size:13px; font-family:'Poppins';
  transition:all .2s ease;
}
.tab.active, .tab:hover{ background:var(--rose); color:#fff; border-color:var(--rose); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; }
.ph{
  aspect-ratio:1; border-radius:18px; background:linear-gradient(150deg,var(--rose-pale),var(--rose));
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
  color:#fff; font-size:26px; cursor:pointer; box-shadow:var(--shadow); transition:transform .3s ease;
  overflow:hidden;
}
.ph.ph-real{ padding:0; }
.ph.ph-real img{ width:100%; height:100%; object-fit:cover; display:block; }
.ph span.lb{ font-size:10px; font-family:'Poppins'; opacity:.9; }
.ph:hover{ transform:scale(1.04) rotate(-1deg); }
.lightbox{
  position:fixed; inset:0; background:rgba(74,58,60,.85); display:none; align-items:center; justify-content:center;
  z-index:200; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.lightbox.show{ display:flex; }
.lightbox-inner{
  background:#fff; border-radius:20px; padding:20px; max-width:min(520px,88vw); text-align:center;
}

.letters{ display:flex; flex-direction:column; gap:14px; }
.letter{
  background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
}
.letter-head{
  display:flex; align-items:center; justify-content:space-between; padding:20px 24px; cursor:pointer;
}
.letter-head h3{ font-size:17px; display:flex; align-items:center; gap:10px; }
.letter-arrow{ transition:transform .3s ease; color:var(--rose-deep); }
.letter.open .letter-arrow{ transform:rotate(180deg); }
.letter-body{ max-height:0; overflow:hidden; transition:max-height .4s ease; }
.letter.open .letter-body{ max-height:600px; }
.letter-body-in{ padding:0 24px 24px; color:var(--ink-soft); font-size:14.5px; white-space:pre-line; font-family:'Playfair Display', serif; font-style:italic; line-height:1.8;}

.reasons{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
.reason{
  background:var(--paper); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow);
  font-size:13.8px; display:flex; gap:10px; align-items:flex-start; transition:transform .25s ease;
}
.reason:hover{ transform:translateY(-3px); background:var(--rose-pale); }
.reason .num{ color:var(--rose-deep); font-family:'Playfair Display'; font-weight:700; font-size:15px; }
.reason.hidden{ display:none; }

.counter-wrap{ text-align:center; }
.counter-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:640px; margin:30px auto 0;
}
.cbox{
  background:var(--paper); border-radius:20px; padding:26px 8px; box-shadow:var(--shadow);
}
.cnum{ font-family:'Playfair Display'; font-size:clamp(26px,4vw,40px); color:var(--rose-deep); }
.clabel{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-top:6px; }

.map-canvas{
  position:relative; background:linear-gradient(160deg,#F3E4E7,var(--rose-pale));
  border-radius:28px; padding:40px; min-height:340px; box-shadow:var(--shadow); overflow:hidden;
}
.map-canvas::before{
  content:''; position:absolute; inset:0; opacity:.35;
  background-image:radial-gradient(var(--rose) 1px, transparent 1px);
  background-size:22px 22px;
}
.pin-list{ position:relative; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.pin{
  background:#fff; border-radius:16px; padding:18px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:flex-start;
}
.pin .ic{ font-size:22px; }
.pin h4{ font-family:'Playfair Display'; font-size:15px; margin-bottom:4px; }
.pin p{ font-size:12.5px; color:var(--ink-soft); margin:0; }

.songs{ display:flex; flex-direction:column; gap:10px; }
.song{
  background:var(--paper); border-radius:16px; padding:14px 20px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.song-info{ display:flex; align-items:center; gap:14px; }
.song-ic{
  width:44px; height:44px; border-radius:50%; background:var(--rose); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
}
.song-title{ font-weight:500; font-size:14.5px;}
.song-why{ font-size:12px; color:var(--ink-soft); }
.song-links a{
  text-decoration:none; font-size:12.5px; color:var(--rose-deep); border:1px solid var(--rose-pale);
  padding:8px 14px; border-radius:100px; margin-left:6px; transition:.2s;
}
.song-links a:hover{ background:var(--rose); color:#fff; }

.video-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
.video-real{
  background:var(--paper); border-radius:18px; padding:12px; box-shadow:var(--shadow);
}
.video-real video{ width:100%; border-radius:14px; display:block; aspect-ratio:16/10; object-fit:cover; background:var(--ink); }
.video-label{ display:block; margin-top:10px; font-size:12.5px; color:var(--ink-soft); text-align:center; }

video:fullscreen{ object-fit:contain !important; aspect-ratio:auto !important; width:100% !important; height:100% !important; background:#000; }
video:-webkit-full-screen{ object-fit:contain !important; width:100% !important; height:100% !important; background:#000; }
video:-moz-full-screen{ object-fit:contain !important; width:100% !important; height:100% !important; background:#000; }

.lock-wrap{ max-width:420px; margin:40px auto 0; text-align:center; }
.lock-icon{ font-size:44px; margin-bottom:14px; }
.pw-input{
  width:100%; padding:14px 18px; border-radius:100px; border:1.5px solid var(--rose-pale);
  font-family:'Poppins'; font-size:16px; text-align:center; margin-bottom:14px; outline:none;
  -webkit-appearance:none; appearance:none;
}
.pw-input:focus{ border-color:var(--rose); }
.pw-error{ color:var(--rose-deep); font-size:12.5px; min-height:18px; margin-bottom:10px; }
.surprise-content{ display:none; margin-top:20px; text-align:left; }
.surprise-content.show{ display:block; animation:fadeIn .6s ease; }
.surprise-card{
  background:var(--paper); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow); margin-bottom:16px;
}
.confetti{ position:fixed; inset:0; pointer-events:none; z-index:300; }
.vale-fallback{
  margin-top:12px; border-radius:14px; padding:26px 14px; background:var(--rose-pale);
  color:var(--rose-deep); font-size:12.5px; align-items:center; justify-content:center; text-align:center;
}

.quiz-card{
  background:var(--paper); border-radius:var(--radius); padding:30px; box-shadow:var(--shadow); max-width:560px; margin:0 auto;
}
.quiz-progress{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
.quiz-q{ font-family:'Playfair Display'; font-size:20px; margin-bottom:20px; }
.quiz-opts{ display:flex; flex-direction:column; gap:10px; }
.quiz-opt{
  text-align:left; padding:13px 18px; border-radius:14px; border:1.5px solid var(--rose-pale); background:#fff;
  cursor:pointer; font-family:'Poppins'; font-size:14px; transition:.2s;
}
.quiz-opt:hover{ background:var(--rose-pale); }
.quiz-opt.correct{ background:#DCEFD9; border-color:#9FCB98; }
.quiz-opt.wrong{ background:#F5D6D6; border-color:#E3A0A0; }
.quiz-result{ text-align:center; }
.quiz-score{ font-family:'Playfair Display'; font-size:38px; color:var(--rose-deep); margin:10px 0; }

.cal-list{ display:flex; flex-direction:column; gap:12px; }
.cal-item{
  background:var(--paper); border-radius:16px; padding:16px 20px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:16px;
}
.cal-date{
  background:var(--rose-pale); color:var(--rose-deep); border-radius:12px; padding:8px 12px; text-align:center;
  font-family:'Playfair Display'; min-width:64px;
}
.cal-date .d{ font-size:19px; display:block; line-height:1;}
.cal-date .m{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
.cal-info h4{ font-size:14.5px; margin-bottom:2px; font-weight:500; }
.cal-info p{ font-size:12px; color:var(--ink-soft); margin:0;}
.cal-badge{
  margin-left:auto; font-size:11px; background:var(--rose); color:#fff; padding:5px 12px; border-radius:100px;
  white-space:nowrap;
}


/* ---------- CARTA ---------- */
.letter-page-wrap{
  max-width:680px; margin:28px auto 0; text-align:center;
}
.envelope-scene{
  position:relative; width:min(420px,92vw); height:330px; margin:24px auto 12px;
  display:flex; align-items:flex-end; justify-content:center; perspective:1200px;
  transition:height 1s cubic-bezier(.2,.75,.2,1), margin-top .9s cubic-bezier(.2,.75,.2,1);
}
.envelope-scene.open{
  height:540px;
  margin-top:165px;
}

.envelope{
  position:relative; width:100%; height:245px;
  filter:drop-shadow(0 18px 24px rgba(151,94,104,.22));
}
.envelope-back{
  position:absolute; inset:auto 0 0; height:190px; background:#F2C5CD;
  border-radius:12px 12px 24px 24px; overflow:hidden; z-index:4;
}
.envelope-back::before,
.envelope-back::after{
  content:''; position:absolute; bottom:0; width:72%; height:100%; background:#EDB6C0;
}
.envelope-back::before{ left:-18%; clip-path:polygon(0 0,100% 100%,0 100%); }
.envelope-back::after{ right:-18%; clip-path:polygon(100% 0,100% 100%,0 100%); }

.envelope-flap{
  position:absolute; left:0; right:0; bottom:82px; height:112px; z-index:7;
  background:#E9A9B5; clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;
  transform:rotateX(0deg);
  transition:transform .8s cubic-bezier(.2,.7,.2,1), z-index .01s .42s;
}
.envelope-seal{
  position:absolute; left:50%; bottom:80px; z-index:9; transform:translate(-50%,50%);
  width:48px; height:48px; border-radius:50%; background:var(--rose-deep); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  box-shadow:0 6px 18px rgba(151,94,104,.3);
  transition:opacity .3s ease, transform .4s ease;
}

.letter-paper{
  position:absolute; left:7%; right:7%; bottom:24px; min-height:330px; z-index:2;
  background:#FFFDF9; border:1px solid #F3E4E6; border-radius:16px;
  padding:30px 28px 28px; box-shadow:0 10px 28px rgba(151,94,104,.16);
  text-align:left;
  transform:translateY(145px) scale(.94);
  opacity:0;
  visibility:hidden;
  overflow:visible;
  will-change:transform,opacity;
}
.letter-paper h3{
  text-align:center; color:var(--rose-deep); font-size:22px; margin-bottom:16px;
}
.letter-paper p{
  margin:0; font-family:'Playfair Display',serif; font-size:16px;
  line-height:1.85; color:var(--ink); white-space:pre-line;
}
.letter-signature{
  margin-top:20px !important; text-align:right; font-style:italic;
  color:var(--rose-deep) !important;
}

.envelope.open .envelope-flap{
  transform:rotateX(180deg);
  z-index:1;
}
.envelope.open .envelope-seal{
  opacity:0;
  transform:translate(-50%,50%) scale(.35);
}
.envelope.open .letter-paper{
  z-index:8;
  opacity:1;
  visibility:visible;
  animation:letterCuteExit 1.65s .45s cubic-bezier(.2,.78,.18,1) both;
}

@keyframes letterCuteExit{
  0%{
    opacity:0;
    transform:translateY(145px) scale(.92) rotate(0deg);
  }
  18%{
    opacity:1;
  }
  58%{
    transform:translateY(-165px) scale(1.015) rotate(-1.2deg);
  }
  72%{
    transform:translateY(-142px) scale(.995) rotate(.8deg);
  }
  86%{
    transform:translateY(-157px) scale(1.005) rotate(-.35deg);
  }
  100%{
    opacity:1;
    transform:translateY(-150px) scale(1) rotate(0deg);
  }
}

.envelope.open{
  animation:envelopeCuteBounce .75s .15s ease-out both;
}
@keyframes envelopeCuteBounce{
  0%,100%{ transform:translateY(0); }
  45%{ transform:translateY(4px) scale(.995); }
  70%{ transform:translateY(-2px) scale(1.002); }
}

.letter-open-btn{
  margin-top:8px;
  position:relative;
  z-index:30;
  pointer-events:auto;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  transition:opacity .35s ease, transform .35s ease;
}
.letter-open-btn.hide{ opacity:0; pointer-events:none; transform:scale(.94); }

.letter-hearts{ position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:12; }
.letter-heart{
  position:absolute; left:50%; bottom:110px; opacity:0; font-size:18px;
  animation:letterFloat 1.9s ease-out forwards;
}
@keyframes letterFloat{
  0%{ opacity:0; transform:translate(-50%,0) scale(.7) rotate(0deg); }
  20%{ opacity:1; }
  100%{ opacity:0; transform:translate(var(--x),-220px) scale(1.15) rotate(var(--r)); }
}

@media (max-width:520px){
  .envelope-scene{ height:310px; }
  .envelope-scene.open{
    height:525px;
    margin-top:150px;
  }
  .envelope{ height:232px; }
  .envelope-back{ height:180px; }
  .envelope-flap{ bottom:78px; height:105px; }
  .envelope-seal{ bottom:76px; }
  .letter-paper{
    left:5%; right:5%; min-height:340px;
    padding:24px 20px 24px;
  }

/* ---------- SISTEMA DE DESBLOQUEIO PROGRESSIVO ----------
   Só o Início começa desbloqueado. As restantes secções vão-se revelando
   uma a uma no menu, à medida que os puzzles são resolvidos. Depois de
   desbloqueada, uma secção fica sempre acessível sem precisar de puzzle. */
let unlockedPages = new Set(['home']);

const dock = document.getElementById('dock');
const main = document.getElementById('main');

function renderNav(){
  // limpa tudo menos o logótipo
  dock.querySelectorAll('.navbtn').forEach(el=>el.remove());
  let nextLockedShown = false;
  pages.forEach(p=>{
    if(unlockedPages.has(p.id)){
      const b = document.createElement('button');
      b.className = 'navbtn';
      b.id = 'nav-'+p.id;
      b.innerHTML = `<span class="ic">${p.icon}</span><span class="lb">${p.label}</span>`;
      b.onclick = ()=> requestNav(p.id);
      dock.appendChild(b);
    } else if(!nextLockedShown){
      // mostra só a PRÓXIMA secção por desbloquear — as seguintes ficam escondidas
      nextLockedShown = true;
      const b = document.createElement('button');
      b.className = 'navbtn locked-next';
      b.id = 'nav-locked-next';
      b.innerHTML = `<span class="ic">🔒</span><span class="lb">Descobrir</span>`;
      b.onclick = ()=> requestNav(p.id);
      dock.appendChild(b);
    }
  });
}

function goTo(id){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.navbtn').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  const navBtn = document.getElementById('nav-'+id);
  if(navBtn) navBtn.classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
  location.hash = id;
}

function getGreeting(){
  const h = new Date().getHours();
  if(h>=5 && h<12) return {txt:"Bom dia", ic:"☀️"};
  if(h>=12 && h<19) return {txt:"Boa tarde", ic:"🌤️"};
  return {txt:"Boa noite", ic:"🌙"};
}

      <div class="cbox"><div class="cnum" id="c-seg">0</div><div class="clabel">Segundos</div></div>
    </div>
    <p style="margin-top:22px;color:var(--ink-soft);font-size:13px;">desde ${new Date(CONFIG.inicioNamoro).toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'})} ❤️</p>
  </div>`;

function updateCounter(){
  const el = document.getElementById('c-anos');
  if(!el) return;
  const start = new Date(CONFIG.inicioNamoro);
  const now = new Date();
  let years = now.getFullYear()-start.getFullYear();
  let months = now.getMonth()-start.getMonth();
  let days = now.getDate()-start.getDate();
  if(days<0){ months--; const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0); days += prevMonth.getDate(); }
  if(months<0){ years--; months += 12; }
  const diffMs = now - start;
  const totalHours = Math.floor(diffMs/3600000);
  const hours = totalHours % 24;
  const minutes = Math.floor(diffMs/60000)%60;
  const seconds = Math.floor(diffMs/1000)%60;
  document.getElementById('c-anos').textContent = years;
  document.getElementById('c-meses').textContent = months;
  document.getElementById('c-dias').textContent = days;
  document.getElementById('c-horas').textContent = hours;
  document.getElementById('c-min').textContent = minutes;
  document.getElementById('c-seg').textContent = seconds;
}
setInterval(updateCounter, 1000);

let quizState = {i:0, score:0};
function buildJogo(){
  quizState = {i:0, score:0};
  return `
  <div class="eyebrow">Jogo</div>

}
function renderQuiz(){
  const area = document.getElementById('quizArea');
  if(!area) return;
  if(quizState.i >= CONFIG.quiz.length){
    const perfeito = quizState.score===CONFIG.quiz.length;
    const gifCfg = perfeito ? CONFIG.quizGif : CONFIG.quizGifErro;
    const gifHtml = (gifCfg && gifCfg.ficheiro) ? `
        <img src="${gifCfg.pasta}${gifCfg.ficheiro}" alt="Reação" style="max-width:220px;width:100%;border-radius:16px;margin:14px auto 0;display:block;"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="vale-fallback" style="display:none;max-width:220px;margin:14px auto 0;">🎬 coloca "${gifCfg.ficheiro}" na pasta ${gifCfg.pasta}</div>` : '';
    area.innerHTML = `
      <div class="quiz-card quiz-result">
        <div style="font-size:34px;">🏆</div>
        <div class="quiz-score">${quizState.score}/${CONFIG.quiz.length}</div>
        <p style="color:var(--ink-soft);">${perfeito ? 'Sabes tudo sobre nós bby!' : 'Borraste...'}</p>
        ${gifHtml}
        <button class="btn ghost" onclick="quizState={i:0,score:0}; renderQuiz();" style="margin-top:16px;">Jogar outra vez</button>
      </div>`;
    return;
  }
  const q = CONFIG.quiz[quizState.i];
  area.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress">Pergunta ${quizState.i+1} de ${CONFIG.quiz.length}</div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((o,idx)=>`<button class="quiz-opt" onclick="answerQuiz(${idx})">${o}</button>`).join('')}
      </div>
    </div>`;
}
function answerQuiz(idx){
  const q = CONFIG.quiz[quizState.i];
  const btns = document.querySelectorAll('.quiz-opt');
  btns.forEach((b,i)=>{
    b.onclick=null;
    if(i===q.correta) b.classList.add('correct');
    else if(i===idx) b.classList.add('wrong');
  });
  if(idx===q.correta) quizState.score++;
  setTimeout(()=>{ quizState.i++; renderQuiz(); }, 900);
}

/* ---------- PUZZLE GATE (puzzle normal, com peças) ---------- */
let puzzlesSolved = 0;
let puzzlePendingTarget = null;
let puzzleSize = 2;
let puzzleTiles = [];
let puzzleSelected = null;
let puzzleLocked = false;
let puzzleCurrentImage = "";
let puzzleImageQueue = [];   // fila embaralhada — garante que todas as fotos aparecem antes de repetir alguma

function getPuzzleSize(){
  const nivel = Math.floor(puzzlesSolved/3);   // sobe de nível a cada 3 secções desbloqueadas
  return Math.min(2+nivel, 3);                  // começa em 2x2, nunca passa de 3x3
}

function requestNav(targetId){
  const current = (location.hash||'#home').replace('#','');
  if(current === targetId){ goTo(targetId); return; }
  if(unlockedPages.has(targetId)){ goTo(targetId); return; }
  puzzlePendingTarget = targetId;
  openPuzzleIntro(targetId);
}

function openPuzzleIntro(targetId){
  const page = pages.find(p=>p.id===targetId);
  document.getElementById('puzzleIntroIcon').textContent = page ? page.icon : '🔒';
  document.getElementById('puzzleIntroTitle').textContent = page ? page.label : 'Nova secção';
  document.getElementById('puzzleIntroSub').textContent = 'Resolve um puzzle para desbloqueares esta secção.';
  document.getElementById('puzzleIntro').style.display = 'block';
  document.getElementById('puzzleBoard').style.display = 'none';
  document.getElementById('puzzleOverlay').classList.add('show');
}

function startPuzzleBoard(){
  document.getElementById('puzzleIntro').style.display = 'none';
  document.getElementById('puzzleBoard').style.display = 'block';
  puzzleSize = getPuzzleSize();
  puzzleSelected = null;
  puzzleLocked = false;
  puzzleCurrentImage = escolherImagemPuzzle();
  document.getElementById('puzzleSub').textContent = `Clica em duas peças para as trocar de lugar (${puzzleSize}×${puzzleSize}).`;
  shufflePuzzle();
}

function escolherImagemPuzzle(){
  const imgs = CONFIG.puzzle.imagens;
  if(imgs.length<=1) return imgs[0];
  if(puzzleImageQueue.length===0){
    // enche a fila com TODAS as fotos e baralha-as — assim nenhuma fica de fora
    puzzleImageQueue = [...imgs];
    for(let i=puzzleImageQueue.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [puzzleImageQueue[i], puzzleImageQueue[j]] = [puzzleImageQueue[j], puzzleImageQueue[i]];
    }
    // evita que a última foto mostrada seja logo a primeira da próxima volta
    if(puzzleImageQueue[puzzleImageQueue.length-1]===puzzleCurrentImage && puzzleImageQueue.length>1){
      const tmp = puzzleImageQueue[0];
      puzzleImageQueue[0] = puzzleImageQueue[puzzleImageQueue.length-1];
      puzzleImageQueue[puzzleImageQueue.length-1] = tmp;
    }
  }
  return puzzleImageQueue.pop();
}

function shufflePuzzle(){
  puzzleLocked = false;
  puzzleSelected = null;
  const total = puzzleSize*puzzleSize;
  puzzleTiles = Array.from({length:total}, (_,i)=>i);
  // baralha todas as peças (Fisher-Yates), sem deixar nenhuma no lugar certo
  let embaralhado;
  do{
    for(let i=total-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [puzzleTiles[i], puzzleTiles[j]] = [puzzleTiles[j], puzzleTiles[i]];
    }
    embaralhado = puzzleTiles.some((v,i)=> v!==i);
  }while(!embaralhado && total>1);
  renderPuzzle();
}

function renderPuzzle(){
  const grid = document.getElementById('puzzleGrid');
  const n = puzzleSize;
  grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  const pasta = CONFIG.puzzle.pasta;
  const src = pasta + puzzleCurrentImage;
  grid.innerHTML = puzzleTiles.map((correctIdx, pos)=>{
    const row = Math.floor(correctIdx/n), col = correctIdx%n;
    const posX = n===1 ? 0 : (col/(n-1))*100;
    const posY = n===1 ? 0 : (row/(n-1))*100;
    const selectedClass = pos===puzzleSelected ? ' selected' : '';
    return `<button class="puzzle-tile${selectedClass}" data-pos="${pos}" onclick="selectTile(${pos})"
      style="background-image:url('${src}'); background-size:${n*100}% ${n*100}%; background-position:${posX}% ${posY}%;"></button>`;
  }).join('');
}

function selectTile(pos){
  if(puzzleLocked) return;
  if(puzzleSelected===null){
    puzzleSelected = pos;
    renderPuzzle();
    return;
  }
  if(puzzleSelected===pos){
    puzzleSelected = null;
    renderPuzzle();
    return;
  }
  [puzzleTiles[puzzleSelected], puzzleTiles[pos]] = [puzzleTiles[pos], puzzleTiles[puzzleSelected]];
  puzzleSelected = null;
  renderPuzzle();
  if(isPuzzleSolved()) onPuzzleSolved();
}

function isPuzzleSolved(){
  return puzzleTiles.every((v,i)=> v===i);
}

function onPuzzleSolved(){
  puzzleLocked = true;
  const grid = document.getElementById('puzzleGrid');
  document.getElementById('puzzleSub').innerHTML = `<span class="puzzle-win">Conseguiste! 🎉</span>`;
  grid.style.opacity = '0.85';
  puzzlesSolved++;
  const target = puzzlePendingTarget;
  if(target) unlockedPages.add(target);
  setTimeout(()=>{
    document.getElementById('puzzleOverlay').classList.remove('show');
    puzzlePendingTarget = null;
    renderNav();
    if(target) goTo(target);
  }, 900);
}

function cancelPuzzle(){
  document.getElementById('puzzleOverlay').classList.remove('show');
  puzzlePendingTarget = null;
  puzzleSelected = null;
}

function unlockAllPages(){
  pages.forEach(p=> unlockedPages.add(p.id));
  renderNav();
}
